spring:
  application:
    name: backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sauberzauber}
    username: ${SPRING_DATASOURCE_USERNAME:sauberzauber}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  session:
    jdbc:
      # tables are created by Flyway (V4__spring_session.sql)
      initialize-schema: never

server:
  forward-headers-strategy: native
  tomcat:
    use-relative-redirects: true
  servlet:
    # Sessions live in Postgres (Spring Session JDBC) and the cookie is persistent, so users
    # stay logged in across app restarts and redeploys until 90 days of inactivity.
    session:
      timeout: 90d
      cookie:
        same-site: lax
        max-age: 90d

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  users: ${APP_USERS:}
  rp-id: ${APP_RP_ID:localhost}
  origin: ${APP_ORIGIN:http://localhost:8080}
  reenroll: ${APP_REENROLL:}
  push:
    # VAPID key pair for Web Push (base64url, e.g. from `npx web-push generate-vapid-keys`);
    # notifications are disabled while the keys are unset.
    public-key: ${APP_VAPID_PUBLIC_KEY:}
    private-key: ${APP_VAPID_PRIVATE_KEY:}
    subject: ${APP_VAPID_SUBJECT:}
