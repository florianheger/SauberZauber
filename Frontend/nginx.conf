# Keep forwarded headers from an outer reverse proxy (TLS termination); fall back to our own values.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

map $http_x_forwarded_host $forwarded_host {
    default $http_x_forwarded_host;
    ""      $http_host;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Backend: REST API, enrollment link and Spring Security's WebAuthn/logout endpoints
    location ~ ^/(api/|enroll$|webauthn/|login/webauthn|logout$|default-ui\.css$|error$) {
        proxy_pass http://backend:8080;
        proxy_set_header Host $forwarded_host;
        proxy_set_header X-Forwarded-Host $forwarded_host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Must always be revalidated, so new versions and service worker updates arrive
    location ~ ^/(index\.html|ngsw-worker\.js|ngsw\.json|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # Hashed build output (main-ABC123.js, styles-ABC123.css, media/…)
    location ~* "^/(.+-[A-Z0-9]{8}\.(js|css)|media/.*)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
